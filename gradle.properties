# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Configuration Cache allows Gradle to skip the configuration phase
# if nothing that affects the build configuration has changed.
org.gradle.configuration-cache=true
# Build Cache（2026-09-07）：任务级输出复用。CI 侧由 gradle/actions/setup-gradle
# 把 ~/.gradle/caches/build-cache-1 一起缓存，未变动模块可直接命中 FROM-CACHE；
# 本地在 clean 后重建时同样受益。
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.enableR8.fullMode=true
# AGP 9.x built-in Kotlin: allow KSP to add Kotlin source sets
android.disallowKotlinSourceSets=false
# 禁用 Kotlin 增量编译（2026-08-07 根治）：本机多 gradle daemon 并发/杀软扫描反复损坏
# source-to-classes.tab（PersistentEnumerator storage corrupted），增量缓存一旦损坏编译即失败；
# 改全量编译后编译稳定（项目 200+ kt 全量编译成本可接受）。
kotlin.incremental=false
# Kotlin 编译 daemon（Gradle worker）JVM 启动崩溃修复（2026-08-25）：
# 原 worker 进程在 GC 自动选择下 exit code 1 且无输出，加 -XX:-UseParallelGC 后由 Gradle 自带提示给出。
# -Xmx3g（2026-09-01）：未显式指定时 worker 默认堆过小，debug+benchmark 双 variant 全量编译 OOM
#（"Not enough memory to run compilation"）。配合 kotlin.incremental=false 的全量编译需要更大堆。
kotlin.daemon.jvmargs=-XX:-UseParallelGC -Xmx3g
# 调大 HTTP socket 超时，规避 dl.google.com 不稳定导致的 lint 工具（kotlin-compiler）下载超时
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=180000

# ── 单一版本源（2026-08-10 C2）：根目录 version.json 为事实源 ──
# 发版只改 version.json；CI（build.yml/release.yml）经 -P 注入覆盖；
# 本地构建未传 -P 时使用以下默认值（应与 version.json 保持一致）。
# 前后端分离管理：frontend=App(com.ufi_axis)、backend=Core(com.ufi_axis_core)
ufiFrontendVersionName=0.0.2
ufiFrontendVersionCode=2
ufiBackendVersionName=0.0.2
ufiBackendVersionCode=2