# Constrained-environment tuning (host has ~1.9 GiB RAM, no swap).
# Force Kotlin compilation in-process so no second -Xmx2048m JVM is spawned
# (the separate KotlinCompileDaemon was getting OOM-killed by the kernel).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
