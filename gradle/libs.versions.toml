[versions]
# ── 共享版本 ──
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.8.0"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
room = "2.8.4"
ksp = "2.2.10-2.0.2"

# ── Core (后端) 专用 ──
ktor = "2.3.12"
coroutines = "1.8.1"
serialization = "1.6.3"

# ── App (前端) 专用 ──
retrofit = "2.11.0"
okhttp = "4.12.0"
gson = "2.11.0"
navigationCompose = "2.8.0"
lifecycleViewmodelCompose = "2.8.0"
materialIconsExtended = "1.7.0"
mockitoCore = "5.14.2"
mockitoKotlin = "5.4.0"
coroutinesTest = "1.9.0"
coil = "3.1.0"
media3 = "1.10.0"
leakcanary = "2.14"
robolectric = "4.13"
turbine = "1.2.0"
workRuntime = "2.9.1"

[libraries]
# ── AndroidX 基础 ──
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
# Robolectric 4.13 的 androidx.test:core 传递依赖不进入测试编译 classpath，
# 单测直接引用 ApplicationProvider 时需显式声明（core:api 等 JVM 单测模块使用）
androidx-test-core = { group = "androidx.test", name = "core", version = "1.6.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ── Compose ──
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# ── Lifecycle / Navigation (App) ──
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── Ktor Server (Core) ──
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-server-cors = { group = "io.ktor", name = "ktor-server-cors", version.ref = "ktor" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktor" }
# 注：Ktor 2.3.x 的 Compression 插件 artifact 名为 ktor-server-compression
# （非 ktor-server-content-encoding，后者在 2.3.12 不存在）。
ktor-server-compression = { group = "io.ktor", name = "ktor-server-compression", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# ── Ktor Client (Core, for Goform) ──
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }

# ── Room Database ──
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# jCIFS-ng: SMB 客户端库，用于从设备自身连接 Samba 共享触发 root preexec（socat root shell）
jcifs-ng = { group = "eu.agno3.jcifs", name = "jcifs-ng", version = "2.1.9" }

# ── Coroutines ──
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# ── Serialization (Core) ──
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# ── Kotlin Reflect (Core) ──
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# ── Mail (Core, for SMS forwarding) ──
javax-mail = { group = "com.sun.mail", name = "android-mail", version = "1.6.7" }
javax-activation = { group = "com.sun.mail", name = "android-activation", version = "1.6.7" }

# ── Network (App) ──
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# ── Image loading (App, Coil) ──
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# ── Media playback (App, Media3 / ExoPlayer) ──
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-extractor = { group = "androidx.media3", name = "media3-extractor", version.ref = "media3" }
# OkHttp 数据源：让 ExoPlayer 复用共享 OkHttp（含设备签名拦截器），与 Coil 图片预览同款鉴权。
# 不能用 DefaultHttpDataSource + 静态签名头：/stream 走 AuthMiddleware 校验 X-Nonce 反重放，
# 静态头会让第二个 Range 请求因 nonce 复用被拒（ExoPlayer 报 2004）。
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

# ── LeakCanary (App, debug-only) ──
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# ── Testing (shared) ──
# Robolectric：在 JVM 单测中提供 Android Context / SharedPreferences / Room（无需真机）
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Ktor 服务端测试宿主：testApplication / 内存 HttpClient（用于 AuthMiddleware 等 Ktor 中间件单测）
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
# MockK：Kotlin 原生 mock 框架，用于构造含多字段 RouteContext 的纯 JVM 单测（PairingRoutesTest）
mockk = { group = "io.mockk", name = "mockk", version = "1.13.13" }
# Turbine：StateFlow / Flow 发射序列断言（F4：DashboardModule load/error/retry 行为测试）
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# ── Testing (App) ──
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockitoCore" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }

# ── Background (App, WorkManager 后台守护) ──
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android" }
# 纯 JVM 模块（:core:contract）用：不引 Android，供 core 与 app 双侧依赖。
# 不写 version.ref —— KGP 已由 AGP 9.x built-in Kotlin 带到 classpath 上，
# 再声明版本会报 "already on the classpath with an unknown version"（与 kotlin-android 同理）。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
